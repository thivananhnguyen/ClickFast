name: Verify CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: clickfast

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      install_seconds: ${{ steps.npm_ci.outputs.duration_seconds }}
      lint_seconds: ${{ steps.lint_cmd.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        id: npm_ci
        run: |
          start=$(date +%s)
          npm ci
          end=$(date +%s)
          echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
      - name: Lint
        id: lint_cmd
        run: |
          start=$(date +%s)
          npm run lint
          end=$(date +%s)
          echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
      - name: Lint job summary
        run: |
          {
            echo "## Lint metrics"
            echo "- npm ci duration: ${{ steps.npm_ci.outputs.duration_seconds }}s"
            echo "- lint duration: ${{ steps.lint_cmd.outputs.duration_seconds }}s"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      install_seconds: ${{ steps.npm_ci.outputs.duration_seconds }}
      test_seconds: ${{ steps.test_cmd.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        id: npm_ci
        run: |
          start=$(date +%s)
          npm ci
          end=$(date +%s)
          echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
      - name: Test
        id: test_cmd
        run: |
          start=$(date +%s)
          npm test
          end=$(date +%s)
          echo "duration_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
      - name: Test job summary
        run: |
          {
            echo "## Test metrics"
            echo "- npm ci duration: ${{ steps.npm_ci.outputs.duration_seconds }}s"
            echo "- test duration: ${{ steps.test_cmd.outputs.duration_seconds }}s"
          } >> "$GITHUB_STEP_SUMMARY"

  security-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
      - name: Secret scan with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Security job summary
        if: always()
        run: |
          {
            echo "## Security metrics"
            echo "- dependency audit threshold: high"
            echo "- secret scan: gitleaks (full git history)"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    needs: [lint, test, security-deps]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        id: docker_publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Release summary
        run: |
          {
            echo "## Release metrics"
            echo "- image tag: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            echo "- image digest: ${{ steps.docker_publish.outputs.digest }}"
            echo "- lint npm ci: ${{ needs.lint.outputs.install_seconds }}s"
            echo "- lint command: ${{ needs.lint.outputs.lint_seconds }}s"
            echo "- test npm ci: ${{ needs.test.outputs.install_seconds }}s"
            echo "- test command: ${{ needs.test.outputs.test_seconds }}s"
            echo "- note: image size can be read in Docker Hub for this exact SHA tag"
          } >> "$GITHUB_STEP_SUMMARY"

  security-image:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Scan published image with Trivy (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Security image summary
        if: always()
        run: |
          {
            echo "## Security image metrics"
            echo "- scanned image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            echo "- threshold: HIGH,CRITICAL"
            echo "- scanner: Trivy"
          } >> "$GITHUB_STEP_SUMMARY"

  sbom-image:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate SBOM with Syft (CycloneDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-cyclonedx-${{ github.sha }}.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom-cyclonedx-${{ github.sha }}.json
      - name: SBOM summary
        run: |
          component_count=$(grep -c '"type":"library"' sbom-cyclonedx-${{ github.sha }}.json || true)
          {
            echo "## SBOM metrics"
            echo "- image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            echo "- format: CycloneDX JSON"
            echo "- artifact: sbom-cyclonedx-${{ github.sha }}"
            echo "- detected library components: ${component_count}"
          } >> "$GITHUB_STEP_SUMMARY"

  security-summary:
    needs: [security-deps, security-image, sbom-image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate security results
        run: |
          deps_result="${{ needs.security-deps.result }}"
          image_result="${{ needs.security-image.result }}"
          sbom_result="${{ needs.sbom-image.result }}"

          verdict="PASS"
          if [[ "$deps_result" == "failure" || "$image_result" == "failure" || "$sbom_result" == "failure" ]]; then
            verdict="FAIL"
          elif [[ "$deps_result" == "cancelled" || "$image_result" == "cancelled" || "$sbom_result" == "cancelled" ]]; then
            verdict="INCOMPLETE"
          fi

          {
            echo "## Security global summary"
            echo ""
            echo "| Scanner | Job | Result | Notes |"
            echo "|---|---|---|---|"
            echo "| Dependency scan | security-deps | ${deps_result} | npm audit (high+) + gitleaks |"
            echo "| Container scan | security-image | ${image_result} | Trivy HIGH/CRITICAL on published image |"
            echo "| Inventory (SBOM) | sbom-image | ${sbom_result} | Syft CycloneDX artifact |"
            echo ""
            echo "**Global verdict:** ${verdict}"
            echo ""
            echo "Reference image tag: \`${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            echo ""
            echo "Interpretation:"
            echo "- \`skipped\` is expected on events that do not publish/scan images."
            echo "- \`failure\` means the security gate blocked this run."
          } >> "$GITHUB_STEP_SUMMARY"

